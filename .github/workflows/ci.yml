name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Run tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build
      - name: Validate installed wheel outside the checkout
        run: |
          python -m venv /tmp/pulse-wheel
          /tmp/pulse-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pulse-wheel/bin/python -m pulse.main --backend offscreen --demo --quit-after 3
